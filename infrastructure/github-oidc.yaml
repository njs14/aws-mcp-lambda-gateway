AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC provider and IAM role for MCP Gateway deployment

Parameters:
  GitHubOrg:
    Type: String
    Description: Your GitHub username or organization name
  
  GitHubRepo:
    Type: String
    Description: Your repository name (without the org/username)

Resources:
  # GitHub OIDC Provider (only create once per account)
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # IAM Role that GitHub Actions will assume
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub github-actions-mcp-gateway-${GitHubRepo}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:*
      
      ManagedPolicyArns:
        # SAM deployment needs these
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonAPIGatewayAdministrator
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryFullAccess

Outputs:
  RoleArn:
    Description: ARN of the IAM role for GitHub Actions (add this to GitHub Secrets as AWS_ROLE_ARN)
    Value: !GetAtt GitHubActionsRole.Arn
