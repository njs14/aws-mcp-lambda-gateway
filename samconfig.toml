# SAM deployment configuration
# Run: sam deploy --guided (first time) or sam deploy (subsequent)

version = 0.1

[default.deploy.parameters]
stack_name = "mcp-gateway"
resolve_s3 = true
s3_prefix = "mcp-gateway"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = []

[default.build.parameters]
use_container = false

[dev.deploy.parameters]
stack_name = "mcp-gateway-dev"
parameter_overrides = [
    "Environment=dev",
    # Add your allowed servers here
    "AllowedServersJson={\"context7\":\"https://mcp.context7.com/mcp\",\"notion\":\"https://mcp.notion.com/mcp\"}"
]

[prod.deploy.parameters]
stack_name = "mcp-gateway-prod"
parameter_overrides = [
    "Environment=prod",
    # Production server list
    "AllowedServersJson={\"context7\":\"https://mcp.context7.com/mcp\"}"
]
