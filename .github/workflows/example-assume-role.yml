name: Example - AWS STS Assume Role Usage

# This is an example workflow demonstrating how to use the aws-sts-assume-role workflow
# To use this workflow:
# 1. Configure your AWS credentials in GitHub secrets:
#    - AWS_ACCESS_KEY_ID
#    - AWS_SECRET_ACCESS_KEY
# 2. Update the role-to-assume input with your AWS IAM Role ARN
# 3. Uncomment the workflow_dispatch trigger or set up the appropriate trigger for your use case

on:
  workflow_dispatch:
    inputs:
      role-arn:
        description: 'AWS IAM Role ARN to assume'
        required: true
        type: string
      aws-region:
        description: 'AWS Region'
        required: false
        type: string
        default: 'us-east-1'

jobs:
  assume-role-and-deploy:
    uses: ./.github/workflows/aws-sts-assume-role.yml
    with:
      aws-region: ${{ inputs.aws-region }}
      role-to-assume: ${{ inputs.role-arn }}
      role-session-name: 'GitHubActions-Example'
      role-duration-seconds: 3600
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  
  use-assumed-credentials:
    needs: assume-role-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Display Assumed Role Information
        run: |
          echo "Assumed Role ARN: ${{ needs.assume-role-and-deploy.outputs.assumed-role-arn }}"
          echo "AWS Account ID: ${{ needs.assume-role-and-deploy.outputs.aws-account-id }}"
      
      - name: Example - List S3 Buckets (requires appropriate permissions)
        run: |
          echo "This is where you would use the assumed role credentials"
          echo "Note: The AWS credentials from the assume-role job are not automatically"
          echo "available in subsequent jobs. You would need to reconfigure credentials"
          echo "in this job if you need to make AWS API calls."
